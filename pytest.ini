[pytest]
# ============================================================
# pytest 的全局配置文件。文件名必须是 pytest.ini（放项目根目录），
# pytest 启动时会先找到它，再决定去哪里找用例、用什么参数跑。
# ============================================================

# ---------- 1. 用例发现规则 ----------
# 只在 api/testcases/ 目录下找用例。将来接入 UI 时改成 testpaths = api/testcases ui/testcases。
# 好处：common/ 里将来可能写 test_ 开头的辅助函数或示例，也不会被误当成用例执行。
#
# ⚠ 这个路径必须真实存在。写错时 pytest 不报错，只给一条 PytestConfigWarning，
#   然后"静默降级"为从当前目录递归搜索，会把不该收的文件全扫进用例集合。
testpaths = api/testcases

# 用例文件必须叫 test_xxx.py。
# 注意：login_test.py 这种"后缀式"命名不会被识别，必须是"前缀式"。
python_files = test_*.py

# 用例类必须以 Test 开头。
python_classes = Test*

# 用例函数必须以 test_ 开头。
python_functions = test_*

# 把项目根目录加入 sys.path，保证 import common.xxx / import config 在任何目录启动都成立。
# 不加这行：PyCharm 里点绿色三角能跑，换个目录敲 python -m pytest 就 ModuleNotFoundError。
pythonpath = .

# ---------- 2. 每次执行的默认参数 ----------
# 执行 python -m pytest 时，这些参数会自动附加，不用每次手敲。
#
# -v                详细模式，每条用例单独一行显示 PASSED / FAILED
# -s                关闭输出捕获，代码里的 print 能直接显示（调试期非常有用）
# --strict-markers  标记名写错直接报错。不加这条，@pytest.mark.smok（少个 e）
#                   会被静默忽略，你以为打了冒烟标记，其实根本没生效
# --alluredir       指定 allure 原始结果输出目录（里面是 json/txt，不是 HTML）
# --clean-alluredir 每次执行前清空该目录，防止上次的旧结果混进新报告，
#                   否则会出现"我删掉的用例怎么还在报告里"的灵异现象
addopts = -v -s --strict-markers --alluredir=./allure-results --clean-alluredir

# ---------- 3. 自定义标记 ----------
# 标记（marker）用于给用例打标签，之后可以用 -m 参数筛选执行。
# 例：python -m pytest -m smoke   只跑冒烟用例
# 每个标记必须在这里登记，否则配合 --strict-markers 会直接报错。
markers =
    smoke: 冒烟用例，验证服务可用与主链路是否连通
    p0: 最高优先级，核心业务链路（登录→加购→下单→支付）
    p1: 次高优先级，重要异常与边界场景
    p2: 低优先级，提示类或兼容性场景
    auth: 登录与鉴权模块
    product: 商品模块
    cart: 购物车模块
    order: 订单模块
    negative: 异常输入与参数校验类
    consistency: 数据一致性校验（金额、库存扣减、购物车清空）
    defect: 已知缺陷的回归用例，用例里须注明缺陷编号
    api: API 层用例（接口契约 / 业务逻辑 / 数据一致性）
    ui: UI 层用例（浏览器操作，Selenium 或 Playwright）
    e2e: 跨层端到端用例（API 准备数据 + UI 验证结果）

# ---------- 4. 日志输出到控制台 ----------
# 让每条请求/响应在终端实时可见，定位失败时不用翻文件。
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S

# ---------- 5. 刻意不做的事 ----------
# 不启用 -n 并行（pytest-xdist）。原因：被测服务是全局共享的内存态，
# 两条用例同时改购物车会互相污染，产生一堆无法复现的假失败。
