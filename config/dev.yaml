# ============================================================
# 环境配置：dev（练习环境）
# 一个环境一个文件。将来要接测试环境，复制成 test.yaml 改值即可，
# 代码一行都不用动 —— 这就是"配置与代码分离"的价值。
# ============================================================

env: dev                              # 环境标识，日志/报告里会打出来，便于确认跑的是哪套
base_url: http://43.133.227.52/api    # 接口根地址，结尾不要带斜杠（拼接时统一处理）
timeout: 15                           # 单次请求超时（秒），网络慢时防止用例无限挂起
verify_ssl: false                     # 是否校验 https 证书。练习站是 http，先占位

# ---------------- 账号 ----------------
# 密码必须加引号！
# 不加引号，YAML 会把 123456 解析成整数，发出去的 JSON 是 {"password": 123456}。
# 现在服务端宽容能登录成功，但类型不一致的坑会在断言参数校验时爆出来。
accounts:
  tester:                             # 普通用户 role=qa，用于业务链路
    username: tester
    password: "123456"
    role: qa
  admin:                              # 管理员 role=admin，只有它能调 /reset
    username: admin
    password: "admin123"
    role: admin

# ---------------- 数据初始化 ----------------
# 被测服务是内存态 + 全局共享，任何人跑过用例都会改变商品库存和购物车。
# true  = 每次会话开始时用管理员账号调 POST /reset，把数据还原成出厂状态
# false = 不动数据（比如别人正在用这个环境演示时）
# 这个开关由第 5 步 conftest.py 里的 session 级 fixture 读取。
reset_before_session: true

# ---------------- 日志 ----------------
logging:
  level: INFO                         # DEBUG / INFO / WARNING / ERROR
  file: logs/run.log                  # 相对项目根目录的日志路径
  max_bytes: 5242880                  # 单文件上限 5MB，超出自动切分
  backup_count: 3                     # 最多保留 3 个历史文件
